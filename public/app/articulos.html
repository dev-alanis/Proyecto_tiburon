<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Artículos · Acuario Tiburón Feliz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="nav"></div>
<main class="page">
    <header class="page-header">
        <div><h1>Artículos</h1><p class="subtitle">Catálogo de artículos físicos</p></div>
        <button class="btn primary" id="btn-new">+ Nuevo</button>
    </header>
    <div class="card" id="filters" style="display:flex"></div>
    <div id="app"></div>
</main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/nav.js"></script>
<script src="js/crud.js"></script>
<script>
    if (!Auth.require()) throw new Error('no auth');
    Nav.render('articulos');

    Crud.render({
        endpoint: '/articulos',
        columns: [
            { key: 'id_articulo',   label: 'ID' },
            { key: 'codigo',        label: 'Código' },
            { key: 'nombre',        label: 'Nombre' },
            { key: 'tipo_articulo', label: 'Tipo' },
            { key: 'unidad_medida', label: 'Unidad' },
            { key: 'existencia',    label: 'Stock',
              render: (r) => {
                  const ex = Number(r.existencia);
                  const mn = Number(r.stock_minimo);
                  const cls = ex <= mn ? 'warn' : 'info';
                  return `<span class="badge ${cls}">${ex}</span>`;
              }},
            { key: 'stock_minimo',  label: 'Mín.' },
            { key: 'activo',        label: 'Estado', render: (r) => UI.badgeBool(r.activo) },
        ],
        fields: [
            { name: 'codigo',           label: 'Código',   type: 'text', required: true },
            { name: 'nombre',           label: 'Nombre',   type: 'text', required: true },
            { name: 'id_tipo_articulo', label: 'Tipo',     type: 'select',
              optionsFrom: '/tipos-articulo', optionValue: 'id_tipo_articulo', optionLabel: 'nombre', required: true },
            { name: 'unidad_medida',    label: 'Unidad',   type: 'text', required: true },
            { name: 'stock_minimo',     label: 'Stock mínimo', type: 'number', step: '0.01', min: '0' },
            { name: 'categoria',        label: 'Categoría', type: 'text' },
            { name: 'marca',            label: 'Marca',    type: 'text' },
            { name: 'descripcion',      label: 'Descripción', type: 'textarea', full: true },
        ],
        filters: [
            { name: 'id_tipo_articulo', label: 'Tipo', type: 'select',
              optionsFrom: '/tipos-articulo', optionValue: 'id_tipo_articulo', optionLabel: 'nombre' },
            { name: 'stock_bajo',       label: 'Stock bajo', type: 'select', options: [
                { value: '', label: '— Todos —' },
                { value: 'true', label: 'Solo stock bajo' },
            ]},
            { name: 'q',                label: 'Buscar', type: 'text' },
        ],
        canCreate: ['ADMIN'],
        canEdit:   ['ADMIN'],
    });
</script>
</body>
</html>
