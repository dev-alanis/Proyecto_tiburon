<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inventario · Acuario Tiburón Feliz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="nav"></div>
<main class="page">
    <header class="page-header">
        <div><h1>Inventario</h1><p class="subtitle">Existencias por artículo</p></div>
    </header>
    <div class="card" id="filters" style="display:flex"></div>
    <div id="app"></div>
</main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/nav.js"></script>
<script src="js/crud.js"></script>
<script>
    if (!Auth.require()) throw new Error('no auth');
    Nav.render('inventario');

    Crud.render({
        endpoint: '/inventario',
        columns: [
            { key: 'id_articulo',        label: 'ID' },
            { key: 'codigo',             label: 'Código' },
            { key: 'nombre',             label: 'Artículo' },
            { key: 'unidad_medida',      label: 'Unidad' },
            { key: 'existencia',         label: 'Existencia' },
            { key: 'stock_minimo',       label: 'Mínimo' },
            { key: 'fecha_actualizacion',label: 'Actualizado', render: (r) => UI.fmtDateTime(r.fecha_actualizacion) },
        ],
        fields: [
            { name: 'existencia', label: 'Existencia', type: 'number', step: '0.01', min: '0', required: true },
        ],
        filters: [
            { name: 'stock_bajo', label: 'Stock bajo', type: 'select', options: [
                { value: '', label: '— Todos —' },
                { value: 'true', label: 'Solo stock bajo' },
            ]},
        ],
        canCreate: false,
        canEdit:   ['ADMIN'],
    });
</script>
</body>
</html>
