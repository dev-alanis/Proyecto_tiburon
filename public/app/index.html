<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Acuario Tiburón Feliz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="splash">
    <div class="ocean">
        <svg class="shark" viewBox="0 0 240 100" xmlns="http://www.w3.org/2000/svg">
            <path class="body" d="M 220 55 Q 200 40 180 42 L 70 45 L 30 15 L 45 50 L 25 85 L 65 68 Q 110 78 170 75 Q 205 70 220 55 Z"/>
            <path class="fin" d="M 90 45 L 100 10 L 130 45 Z"/>
            <circle class="eye" cx="195" cy="52" r="3"/>
            <path class="boca" d="M 218 56 Q 205 62 190 62"/>
            <path class="agalla" d="M 160 46 Q 155 55 160 68"/>
            <path class="agalla" d="M 150 47 Q 145 55 150 66"/>
        </svg>
        <div class="bubbles">
            <span class="bubble" style="left:15%; animation-delay:0s;"></span>
            <span class="bubble" style="left:38%; animation-delay:1.2s;"></span>
            <span class="bubble" style="left:60%; animation-delay:2.4s;"></span>
            <span class="bubble" style="left:82%; animation-delay:0.6s;"></span>
            <span class="bubble" style="left:92%; animation-delay:3.1s;"></span>
        </div>
        <div class="waves w1"></div>
        <div class="waves w2"></div>
    </div>
    <h1>Acuario Tiburón Feliz</h1>
    <p class="sub">Cargando<span class="dots"></span></p>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    // Espera mínima para que se vea la animación
    setTimeout(() => {
        if (API.getToken()) {
            window.location.href = 'dashboard.html';
        } else {
            window.location.href = 'login.html';
        }
    }, 2200);
</script>
</body>
</html>
